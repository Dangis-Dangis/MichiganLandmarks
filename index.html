<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b3d2e" />
  <title>Michigan Landmarks</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link href="./vendor/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="topbar">
    <button id="menuToggle" class="icon-btn" aria-label="Toggle filters" title="Filters" aria-expanded="false">&#9776;</button>
    <div id="searchWrap">
      <input id="searchInput" type="search" placeholder="Search landmarks" autocomplete="off" enterkeyhint="search" />
      <button id="searchClear" class="icon-btn" aria-label="Clear" title="Clear">&times;</button>
    </div>
    <button id="locateBtn" class="icon-btn" aria-label="Find near me" title="Near me">&#9678;</button>
    <button type="button" id="aboutBtn" class="icon-btn" aria-label="Help" title="Help">
      <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="8" r="1.4" fill="currentColor"/>
        <path d="M12 11.5 v6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="viewToggle" class="icon-btn" aria-label="Toggle list/map" title="List / Map">&#8801;</button>
  </header>

  <div id="filtersBackdrop" class="hidden"></div>
  <aside id="filters" class="hidden" aria-label="Filters and sorting">
    <div class="filters-header">
      <h2>Filters</h2>
      <button id="filtersClose" class="icon-btn" aria-label="Close filters" title="Close">&times;</button>
    </div>
    <div class="filters-bulk">
      <button type="button" id="filtersShowAll" class="text-btn">Show all</button>
      <button type="button" id="filtersHideAll" class="text-btn">Hide all</button>
    </div>
    <div class="filter-section">
      <h3>Categories</h3>
      <div id="categoryFilters"></div>
    </div>
    <div class="filter-section">
      <h3>Sort by</h3>
      <select id="sortSelect">
        <option value="name">Name (A&ndash;Z)</option>
        <option value="year_desc">Year (newest)</option>
        <option value="year_asc">Year (oldest)</option>
        <option value="distance" disabled>Distance (needs location)</option>
      </select>
    </div>
    <div class="filter-section">
      <label class="checkbox filter-toggle" for="withImageOnly"><input type="checkbox" id="withImageOnly" /> Has photo only</label>
      <label class="checkbox filter-toggle" for="hideLocalityPins"><input type="checkbox" id="hideLocalityPins" /> Hide city/township pins</label>
    </div>
    <p id="resultCount" class="muted"></p>
  </aside>

  <div id="searchHint" class="search-hint hidden" role="status"></div>

  <main id="content">
    <div id="map"></div>
    <section id="listView" class="hidden" aria-label="List of landmarks"></section>
  </main>

  <div id="detailPanel" class="hidden" role="dialog" aria-label="Landmark details">
    <button id="detailClose" class="icon-btn" aria-label="Close">&times;</button>
    <div id="detailHandle" class="detail-handle" aria-hidden="true"></div>
    <div id="detailBody"></div>
  </div>

  <div id="status" class="status hidden"></div>

  <div id="wikiPanel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="wikiTitle" aria-hidden="true">
    <header class="wiki-header">
      <button type="button" id="wikiBack" class="icon-btn hidden" aria-label="Back to help topics" title="Back">&#8592;</button>
      <h1 id="wikiTitle">Help</h1>
      <button type="button" id="wikiClose" class="icon-btn" aria-label="Close help" title="Close">&times;</button>
    </header>
    <div id="wikiHomeTools" class="wiki-home-tools">
      <input id="wikiSearch" type="search" placeholder="Search help topics" autocomplete="off" />
    </div>
    <nav id="wikiNav" class="wiki-nav" aria-label="Help topics"></nav>
    <div id="wikiBody" class="wiki-body"></div>
  </div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./vendor/marked.min.js"></script>
  <script src="./wiki.js"></script>
  <script src="./app.js"></script>
</body>
</html>
